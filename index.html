<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f4ee">
  <title>今天吃什么（沙河食堂？）</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="masthead">
    <div class="wrap">
      <h1>今天吃什么（沙河食堂？）</h1>
      <p id="snapshot-status" hidden></p>
    </div>
  </header>

  <main class="wrap layout">
    <section class="card form-card" aria-label="点评">
      <form id="review-form">
        <div class="grid-two">
          <label><select id="canteen" aria-label="食堂" required><option value=""></option></select>
          </label>
          <label><select id="window" aria-label="窗口" required disabled><option value=""></option></select>
          </label>
        </div>
        <div class="grid-two">
          <label><select id="meal" aria-label="餐次" required disabled><option value=""></option></select>
          </label>
          <label><select id="dish" aria-label="菜品" required disabled><option value=""></option></select>
          </label>
        </div>
        <label id="manual-dish-label" hidden><input id="manual-dish" aria-label="菜名" maxlength="120">
        </label>
        <label><input id="visit-date" aria-label="实际吃的日期" type="date" required>
        </label>
        <fieldset class="rating">

          <div class="stars" role="radiogroup" aria-label="评分，1 到 5 分">
            <label><input type="radio" name="rating" value="1" aria-label="1 分" required><span aria-hidden="true">★</span></label>
            <label><input type="radio" name="rating" value="2" aria-label="2 分"><span aria-hidden="true">★★</span></label>
            <label><input type="radio" name="rating" value="3" aria-label="3 分"><span aria-hidden="true">★★★</span></label>
            <label><input type="radio" name="rating" value="4" aria-label="4 分"><span aria-hidden="true">★★★★</span></label>
            <label><input type="radio" name="rating" value="5" aria-label="5 分"><span aria-hidden="true">★★★★★</span></label>
          </div>
        </fieldset>
        <label>
          <textarea id="comment" aria-label="体验" maxlength="500" rows="4" required></textarea>
        </label>
          <button class="primary" type="submit" aria-label="提交评价到 GitHub">↗</button>
      </form>
      <div id="prepared" class="prepared" hidden>
        <code id="review-filename"></code>
        <textarea id="review-json" rows="10" readonly aria-label="评价 JSON"></textarea>
        <button id="copy-json" type="button" aria-label="复制 JSON">⧉</button>
      </div>
    </section>

    <aside class="side">
      <section class="card" aria-label="推荐">
            <button id="pick-food" class="primary" type="button" disabled aria-label="随机推荐">⚄</button>
        <div id="pick-result" class="pick-result" role="status" aria-live="polite"></div>
      </section>
      <section class="card" aria-label="菜单">
            <div id="menu-preview" class="menu-preview"></div>
      </section>
      <section class="card" aria-label="点评列表">
          <div id="recent-reviews" class="recent-reviews"></div>
      </section>
    </aside>
  </main>

</body>
</html>
