<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f4ee">
  <title>今天吃什么（沙河食堂？）</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="masthead">
    <div class="wrap">
      <h1>今天吃什么（沙河食堂？）</h1>
      <p id="snapshot-status" class="snapshot">正在读取菜单快照…</p>
    </div>
  </header>

  <main class="wrap layout">
    <section class="card form-card" aria-label="点评">
      <p class="hint">提交后将打开 GitHub，请确认并发起 Pull Request。</p>
      <form id="review-form">
        <div class="grid-two">
          <label>食堂
            <select id="canteen" required><option value="">选择食堂</option></select>
          </label>
          <label>窗口
            <select id="window" required disabled><option value="">先选食堂</option></select>
          </label>
        </div>
        <div class="grid-two">
          <label>餐次
            <select id="meal" required disabled><option value="">先选窗口</option></select>
          </label>
          <label>菜品
            <select id="dish" required disabled><option value="">先选餐次</option></select>
          </label>
        </div>
        <label id="manual-dish-label" hidden>菜单里没有？填写菜名
          <input id="manual-dish" maxlength="120" placeholder="请输入实际吃到的菜名">
        </label>
        <label>实际吃的日期
          <input id="visit-date" type="date" required>
        </label>
        <fieldset class="rating">
          <legend>打几分？</legend>
          <div class="stars" role="radiogroup" aria-label="评分，1 到 5 分">
            <label><input type="radio" name="rating" value="1" required><span>1</span></label>
            <label><input type="radio" name="rating" value="2"><span>2</span></label>
            <label><input type="radio" name="rating" value="3"><span>3</span></label>
            <label><input type="radio" name="rating" value="4"><span>4</span></label>
            <label><input type="radio" name="rating" value="5"><span>5</span></label>
          </div>
        </fieldset>
        <label>一句真实体验 <span class="optional">（最多 500 字）</span>
          <textarea id="comment" maxlength="500" rows="4" placeholder="口味、分量、排队时间……具体一点，更能帮到大家" required></textarea>
        </label>
        <p class="privacy">不要填写学号、手机号或他人的个人信息。GitHub PR 作者身份会公开。</p>
        <button class="primary" type="submit">生成评价，去 GitHub 提 PR ↗</button>
      </form>
      <div id="prepared" class="prepared" hidden>
        <p><strong>评价 JSON 已准备好。</strong>若 GitHub 没有自动填入，请复制下面的内容，作为新文件提交。</p>
        <code id="review-filename"></code>
        <textarea id="review-json" rows="10" readonly aria-label="评价 JSON"></textarea>
        <button id="copy-json" type="button">复制 JSON</button>
      </div>
    </section>

    <aside class="side">
      <section class="card" aria-label="推荐">
          <p class="hint">选择食堂、窗口和餐次可缩小推荐范围；留空则随机挑选。</p>
        <button id="pick-food" class="primary" type="button" disabled>从菜单里挑一道</button>
        <div id="pick-result" class="pick-result" role="status" aria-live="polite"></div>
      </section>
      <section class="card" aria-label="菜单">
          <p class="hint">菜单每月更新，实际供应以 <a href="https://hqdc.bupt.edu.cn/mb/" target="_blank" rel="noopener noreferrer">e 键订餐</a> 为准。</p>
        <div id="menu-preview" class="menu-preview">选好食堂和窗口后，这里会显示菜品。</div>
      </section>
      <section class="card" aria-label="点评列表">
          <div id="recent-reviews" class="recent-reviews">正在读取点评…</div>
      </section>
    </aside>
  </main>

</body>
</html>
