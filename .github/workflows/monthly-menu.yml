name: Refresh Shahe menu

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public menu fields
        env:
          BUPT_MENU_TOKEN: ${{ secrets.BUPT_MENU_TOKEN }}
        run: python scripts/update_menu.py
      - name: Validate snapshot and site
        run: |
          python -m unittest discover -s tests
          python scripts/build_site.py
      - name: Commit changed menu
        run: |
          if ! git diff --quiet -- data/menu.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/menu.json
            git commit -m "Update Shahe menu snapshot"
            git push
          fi
